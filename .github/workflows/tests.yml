# Smoke test on Windows, Linux and macOS (CPU): install, list, check, run every model family, build the UI.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ hashFiles('zoo/registry.py') }}

      - name: Install (CPU PyTorch on Linux/Windows, default wheel on macOS)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt
          python -m pip install frictionless     # test only: validates the Camtrap DP package

      - name: List models, hardware check, wrong model name
        run: |
          python main.py --list_models
          python main.py --check
          if python main.py -m no-such-model; then echo "wrong model name was accepted"; exit 1; fi

      - name: Gated model without token explains what to do
        run: |
          if python main.py -m sam3 > gated.txt 2>&1; then echo "sam3 ran without a token?"; exit 1; fi
          cat gated.txt
          grep -q "docs/GATED_MODELS.md" gated.txt
          grep -q "huggingface.co/settings/tokens" gated.txt

      - name: Run each detector family on CPU, and detector + classifier
        run: |
          python main.py -m insectdct-v8-s -c none -d cpu -i images/test_image.jpg -o ci_out
          python main.py -m flatbug-n -d cpu -f images -o ci_out
          python main.py -m insectdct-v8-s -d cpu -i images/test_image.jpg -o ci_out --camtrapdp --latitude 56.16 --longitude 10.20
          python main.py -m arthronat-n -c none -d cpu -i images/test_4_domains.jpg -o ci_out
          python main.py -m mothbot-mbd-1-1 -c none -d cpu -i images/test_4_domains.jpg -o ci_out
          python - <<'EOF'
          import csv, json, os
          for folder in ["insectdct-v8-s", "flatbug-n", "insectdct-v8-s+insectdct-cls-v7"]:
              d = os.path.join("ci_out", folder)
              with open(os.path.join(d, "test_image_detections.csv")) as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 1, (folder, rows)
              assert os.path.isfile(os.path.join(d, "test_image_annotated.jpg")), folder
              print(folder, len(rows), "detections OK", [r["taxon"] for r in rows])
          coco = json.load(open(os.path.join("ci_out", "flatbug-n", "test_image_coco.json")))
          assert coco["annotations"], "COCO: no annotations"
          assert all(len(a["segmentation"][0]) >= 6 for a in coco["annotations"]), "COCO: flat-bug outlines missing"
          from frictionless import validate
          report = validate(os.path.join("ci_out", "insectdct-v8-s+insectdct-cls-v7", "camtrap-dp", "datapackage.json"))
          assert report.valid, report.flatten(["type", "message"])
          print("Camtrap DP package valid")
          for folder in ["arthronat-n", "mothbot-mbd-1-1"]:
              with open(os.path.join("ci_out", folder, "test_4_domains_detections.csv")) as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 3, (folder, len(rows))
              print(folder, len(rows), "detections on the 4-domain image")
          assert all(r["angle"] != "" for r in rows), "Mothbot: oriented boxes without an angle"
          with open(os.path.join("ci_out", "insectdct-v8-s+insectdct-cls-v7", "test_image_detections.csv")) as f:
              taxa = [r["taxon"] for r in csv.DictReader(f)]
          assert "Apis mellifera" in taxa, taxa           # the test image is a honey bee
          EOF

      - name: ISIR output is valid (model-db's own checker)
        run: |
          python main.py -m insectdct-v8-s -d cpu -f images -o ci_out/folder
          git init -q model-db && cd model-db
          git fetch -q --depth 1 https://github.com/InsectAI-COST-Action/model-db c05b22d884891ed64717a862f53aee9ed22cf3a7
          git checkout -q FETCH_HEAD && cd ..
          python - <<'EOF'
          import glob, json, os, sys
          sys.path.insert(0, os.path.join("model-db", "src"))
          from iai_model_zoo.formats.adapters import coco as model_db_coco
          from iai_model_zoo.formats.adapters._common import checked_ir
          records = [(p, json.load(open(p, encoding="utf-8"))) for p in
                     glob.glob("ci_out/**/*_isir.json", recursive=True) + glob.glob("docs/isir/*.json")]
          for p in glob.glob("ci_out/**/isir.jsonl", recursive=True) + glob.glob("docs/isir/*.jsonl"):
              records += [(p, json.loads(line)) for line in open(p, encoding="utf-8")]
          assert len(records) >= 10, len(records)
          for p, r in records:
              checked_ir(r)                                              # model-db's own ISIR v1 check
              ids = {i["id"] for i in r["instances"]}
              for c in r.get("extra_information", {}).get("insect_model_zoo", {}).get("classifications", []):
                  assert c["instance_id"] in ids, (p, c)
              coco_file = p.replace("_isir.json", "_coco.json")
              if p.endswith("_isir.json") and os.path.isfile(coco_file):   # same boxes as model-db's own COCO -> ISIR
                  theirs = model_db_coco.to_ir(json.load(open(coco_file, encoding="utf-8"))).images[0]["instances"]
                  assert len(theirs) == len(r["instances"]) and all(
                      abs(u - v) < 0.02 for a, b in zip(r["instances"], theirs) for u, v in zip(a["bbox"], b["bbox"])), p
          print(len(records), "ISIR records valid")
          EOF

      - name: UI builds
        run: python -c "from zoo.ui import build; build('flatbug-n', 'cpu', None, None, 'ci_out', 'images/test_image.jpg')"

# Smoke test on Windows, Linux and macOS (CPU): install, list, check, run every model family, build the UI.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ hashFiles('zoo/registry.py') }}

      - name: Install (CPU PyTorch on Linux/Windows, default wheel on macOS)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt

      - name: List models, hardware check, wrong model name
        run: |
          python main.py --list_models
          python main.py --check
          if python main.py -m no-such-model; then echo "wrong model name was accepted"; exit 1; fi

      - name: Gated model without token explains what to do
        run: |
          if python main.py -m sam3 > gated.txt 2>&1; then echo "sam3 ran without a token?"; exit 1; fi
          cat gated.txt
          grep -q "docs/GATED_MODELS.md" gated.txt
          grep -q "huggingface.co/settings/tokens" gated.txt

      - name: Run each detector family on CPU, and detector + classifier
        run: |
          python main.py -m insectdct-v8-s -c none -d cpu -o ci_out
          python main.py -m flatbug-n -d cpu -f images -o ci_out
          python main.py -m insectdct-v8-s -d cpu -o ci_out
          python - <<'EOF'
          import csv, json, os
          for folder in ["insectdct-v8-s", "flatbug-n", "insectdct-v8-s+insectdct-cls-v7"]:
              d = os.path.join("ci_out", folder)
              with open(os.path.join(d, "test_image_detections.csv")) as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 1, (folder, rows)
              assert os.path.isfile(os.path.join(d, "test_image_annotated.jpg")), folder
              print(folder, len(rows), "detections OK", [r["taxon"] for r in rows])
          js = json.load(open(os.path.join("ci_out", "flatbug-n", "test_image_detections.json")))
          assert all(len(det["polygon"]) > 2 for det in js["detections"]), "flat-bug outlines missing"
          with open(os.path.join("ci_out", "insectdct-v8-s+insectdct-cls-v7", "test_image_detections.csv")) as f:
              taxa = [r["taxon"] for r in csv.DictReader(f)]
          assert "Apis mellifera" in taxa, taxa           # the test image is a honey bee
          EOF

      - name: UI builds
        run: python -c "from zoo.ui import build; build('flatbug-n', 'cpu', None, None, 'ci_out', 'images/test_image.jpg')"

<!--
  The insect emblem, cropped out of favicon.svg.

  The full logo is a 1.56:1 banner with "Insect AI" set inside it. That reads
  well at page width and not at all at the size a header mark or a browser tab
  needs: at 16px the lettering is a smudge, and beside the brand text in the
  header it would say "Insect AI" twice. This is the same artwork cropped to the
  disc, which stays legible down to 16px.

  Generated from static/favicon.svg by keeping the green disc and the white
  insect and setting the viewBox to the disc bounds. If the logo is redrawn,
  regenerate this the same way rather than editing the paths by hand.
-->

